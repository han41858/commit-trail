name: AI development CI follow-up

on:
  workflow_run:
    workflows: [CI]
    branches: ['ai/issue-*']
    types: [completed]

permissions: {}

jobs:
  complete-ci:
    if: >-
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion != '' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'ai/issue-') &&
      (endsWith(github.event.workflow_run.head_branch, '-codex') ||
       endsWith(github.event.workflow_run.head_branch, '-claude'))
    concurrency:
      group: ai-development-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: ai-development
    timeout-minutes: 5
    permissions:
      actions: write
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/dev
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/ai-development/run.mjs --complete-ci
        env:
          GH_TOKEN: ${{ github.token }}
          AI_AUTOMATION_TOKEN: ${{ secrets.AI_AUTOMATION_TOKEN }}
