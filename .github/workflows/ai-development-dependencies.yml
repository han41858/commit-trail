name: AI development merge follow-up

on:
  pull_request_target:
    branches: [dev]
    types: [closed]

permissions: {}

jobs:
  wake-dependents:
    if: github.event.pull_request.merged == true
    concurrency:
      group: ai-development-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Run only trusted base code. The merged PR payload is data.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/dev
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/ai-development/run.mjs --wake-dependents
        env:
          GH_TOKEN: ${{ github.token }}
