name: AI development cleanup

on:
  workflow_run:
    workflows: [AI development]
    branches: [dev]
    types: [completed]

permissions: {}

jobs:
  reconcile:
    if: >-
      github.event.workflow_run.path == '.github/workflows/ai-development.yml' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'skipped'
    concurrency:
      group: ai-development-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/ai-development/run.mjs --reconcile
        env:
          GH_TOKEN: ${{ github.token }}
